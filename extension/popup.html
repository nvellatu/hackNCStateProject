<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body { font-family: system-ui, sans-serif; width: 320px; margin: 12px; }
      h1 { font-size: 14px; margin: 0 0 6px; }
      .meta { font-size: 12px; opacity: 0.85; margin-bottom: 8px; }
      .pill { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11px; background: #eee; }
      ul { padding-left: 16px; margin: 8px 0 0; }
      li { font-size: 12px; line-height: 1.4; margin: 4px 0; }

      h2 { font-size: 12px; margin: 12px 0 6px; }
      .cookie-item { margin: 8px 0; }
      .cookie-name { font-size: 12px; font-weight: 600; }
      .meta { font-size: 11px; opacity: 0.85; line-height: 1.3; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    </style>
  </head>
  <body>
    <h1>Streetlight Ledger</h1>
    <div class="meta" id="meta">Loading…</div>
    <div class="pill" id="fog"></div>

    <ul id="list"></ul>

    <div class="row">
      <button id="refresh">Refresh</button>
    </div>

    <h2>Cookies</h2>
    <div class="meta" id="cookieStatus">Loading cookies…</div>
    <ul id="cookieList"></ul>

    <script src="popup.js"></script>
  </body>
  
</html>
