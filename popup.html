<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My First Extension</title>
  <style>
    body {
      width: 280px;
      padding: 16px;
      font-family: system-ui, sans-serif;
      text-align: center;
      background: #f0f4f8;
    }
    h1 { margin: 0 0 12px; font-size: 1.4rem; }
    button {
      padding: 10px 20px;
      font-size: 1rem;
      background: #0060df;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    button:hover { background: #0050bb; }
  </style>
</head>
<body>
  <h1>Hello from your extension! 🎉</h1>
  <p>Click the button below:</p>
  <button id="greet">Say Hi!</button>

  <script src="popup.js"></script>
</body>
</html>
